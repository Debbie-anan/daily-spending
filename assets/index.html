function rows(list){return list.map(x=>`<button class="row" data-id="${Number(x._id)}"><span class="rowIcon">${icon(Number(x.cents)<0&&x.state==='auto'?'refund':'bag')}</span><span class="rowmain"><b>${esc(title(x))}</b><small>${esc(x.source)}${String(x.content).startsWith('手动记账：')?' · 手动':''} · ${esc(dateTime(x.posted))}</small></span><span class="rowvalue">${x.state==='auto'?signed(Number(x.cents)):x.state==='ignored'?'已排除':'待识别'}</span></button>`).join('')}
function daily(k){return events.filter(x=>key(new Date(Number(x.posted)))===k)}
function calendar(){let start=(new Date(year,month,1).getDay()+6)%7,count=new Date(year,month+1,0).getDate(),prefix=`${year}-${pad(month+1)}`;let arr=events.filter(x=>key(new Date(Number(x.posted))).startsWith(prefix)),net=total(arr);let cells='<div aria-hidden="true"></div>'.repeat(start);for(let d=1;d<=count;d++){let k=`${prefix}-${pad(d)}`,a=daily(k);cells+=`<button class="day ${d===selected?'selected':''} ${k===today?'today':''}" data-day="${d}" ${k>today?'disabled':''} aria-pressed="${d===selected}" aria-label="${month+1}月${d}日 ${a.length?signed(total(a))+'元':'暂无记录'}"><span class="num">${d}</span><span class="spend">${k>today?'':a.length?signed(total(a)):'—'}</span></button>`}
return header('消费日历','A LITTLE SPEND, EVERY DAY')+`<div class="month-top"><strong>${year} / ${pad(month+1)}</strong><div class="month-controls"><button id="prevMonth" aria-label="上个月">‹</button><button id="nextMonth" aria-label="下个月" ${year===new Date().getFullYear()&&month===new Date().getMonth()?'disabled':''}>›</button></div></div><div class="calendar-box"><div class="weekdays">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells}</div><div class="callegend"><span>净额 / 元 · 支出 − 退款 +</span><span>— 暂无记录</span></div></div><div class="month-summary"><span>本月净支出<small>已抵扣退款</small></span><strong>${net<0?'+':''}¥ ${yuan(net)}</strong></div>${!arr.length?'<p class="footer-note">本月还没有已识别记录。<br>授权后，收到付款通知即可自动记账。</p>':''}<p class="footer-note">支出按通知日期 · 退款按收到日期抵扣<br>未收到通知可能漏记，不代表当天零消费</p>`}
function home(){let arr=daily(today),net=total(arr);return header('今天也有好好记账！','HELLO, MY LITTLE LEDGER')+`<div class="datebar"><span>${new Date().getMonth()+1} 月 ${new Date().getDate()} 日 · 今天</span><span class="live">${state.granted?'● 已授权通知读取':'○ 尚未授权'}</span></div><div class="total"><label>今日净额 / 元 · 退款 − 支出</label><div class="amount"><span>¥</span>${signed(net)}</div><p class="sub">${arr.length} 笔已识别记录</p></div><div class="channels">${['微信','支付宝'].map((name,i)=>{let a=arr.filter(x=>x.source===name);return `<div class="channel"><div class="channelhead"><span class="logo ${i?'ali':''}">${i?'支':'微'}</span>${name}</div><strong>${signed(total(a))}</strong><small>${a.length} 笔 · 退款已抵扣</small></div>`}).join('')}</div>${!state.granted?'<button class="primary" data-action="permission">开启通知读取权限</button>':''}<button class="primary" data-action="manual">＋ 手动记一笔</button><button class="calendar-jump" data-go="calendar">看看这个月的花费 <span>翻开月历 ↗</span></button><div class="sectiontitle">最近消费<button class="textbutton" data-go="records">查看全部 ↗</button></div>${arr.length?rows(arr.slice(0,4)):'<div class="empty">账本还是空的。<br>收到明确的付款通知后，会出现在这里。</div>'}<p class="footer-note">数据只保存在手机里 · 支出与退款均保留明细</p>`}
function records(){let dates=[...new Set(events.map(x=>key(new Date(Number(x.posted)))))].sort().reverse();if(range!=='all'&&!dates.includes(range))range='all';let a=events.filter(x=>(filter==='全部'||x.source===filter)&&(range==='all'||key(new Date(Number(x.posted)))===range));return header('消费明细','每一笔，都看得见')+`<div class="datebar"><select class="field" id="range" aria-label="日期范围"><option value="all">全部日期</option>${dates.map(k=>`<option value="${k}" ${range===k?'selected':''}>${k}</option>`).join('')}</select><span class="sub">${a.length} 笔记录</span></div><button class="primary secondary" data-action="manual">＋ 手动记一笔转账或红包</button><div class="tabs">${['全部','微信','支付宝'].map(s=>`<button data-filter="${s}" class="${filter===s?'selected':''}">${s}</button>`).join('')}</div>${a.length?rows(a):'<div class="empty">还没有符合条件的记录。</div>'}<p class="footer-note">点击记录查看记录摘要 · 微信转账与红包手动记入；支付宝明确转出可自动记录</p>`}
function diagnostics(){let pending=state.events.filter(x=>x.state==='pending');return header('通知与设置','自动记账，从这里开始')+`<div class="notice ${state.granted?'':'warning'}"><span>${state.granted?'● 通知读取已授权':'○ 尚未授权通知读取'}<br>自动记付款、退款及支付宝明确转出；微信转账和红包手动记。</span></div><button class="primary" data-action="permission">${state.granted?'管理通知权限':'开启通知读取权限'}</button><button class="primary secondary" data-action="settings">后台运行设置</button><div class="statcard"><h3>采集状态</h3><div class="statline"><span>最近连接</span><span>${esc(dateTime(state.connectedAt))}</span></div><div class="statline"><span>最近收到</span><span>${esc(dateTime(state.lastSeen))}</span></div><div class="statline"><span>通知回调</span><span>${Number(state.seen)||0} 次</span></div><p style="margin-top:12px">授权不代表后台始终在线。最近连接是历史时间；后台清理或强行停止可能导致漏记。请允许自启动和后台运行。</p></div><div class="sectiontitle">待识别通知<span class="sub">${pending.length} 条 · 不计入净额</span></div>${pending.length?rows(pending):'<p class="setting-note">暂无待识别通知。</p>'}<div class="statcard"><h3>记账规则</h3><p>付款通知 → 自动支出<br>支付宝明确转出 → 自动支出<br>微信转账、红包 → 手动记一笔<br>成功退款 → 收到当日抵扣，不关联原订单<br>退款大于支出 → 月历显示“+5”<br>收款、领红包 → 不计入<br>没有通知或金额不明确 → 可能漏记</p></div><div class="statcard"><h3>纯离线版 · ${esc(state.appVersion)}</h3><p>没有联网权限，不检查或下载在线界面。<br>账本和界面都保存在手机本机。<br>后续更新需手动覆盖安装新版 APK。<br>已移除请求安装应用权限。</p></div><button class="primary secondary" data-action="export">导出本机记录</button><button class="plain" data-action="clear" style="width:100%;margin-top:18px">清空所有记录</button><p class="footer-note">今日花费 ${esc(state.appVersion)} · 本地账本<br>${native?'':'电脑查看的是安装包内界面，无手机通知权限。'}</p>`}
function render(){let y=document.getElementById('screen').scrollTop;document.getElementById('screen').innerHTML=page==='calendar'?calendar():page==='home'?home():page==='records'?records():diagnostics();document.querySelector('.nav').innerHTML=['home','calendar','records','diagnostics'].map(n=>`<button data-go="${n}" class="${page===n?'active':''}">${icon(n)}<span>${{home:'今日',calendar:'月历',records:'明细',diagnostics:'通知'}[n]}</span></button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render();document.getElementById('screen').scrollTop=0});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.day);render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(Number(b.dataset.id)));let r=document.getElementById('range');if(r)r.onchange=()=>{range=r.value;render()};let prev=document.getElementById('prevMonth'),next=document.getElementById('nextMonth');if(prev)prev.onclick=()=>moveMonth(-1);if(next)next.onclick=()=>moveMonth(1);document.getElementById('screen').scrollTop=y}
function moveMonth(n){let d=new Date(year,month+n,1),now=new Date();if(d>new Date(now.getFullYear(),now.getMonth(),1))return;year=d.getFullYear();month=d.getMonth();selected=year===now.getFullYear()&&month===now.getMonth()?now.getDate():1;render()}
let toastTimer;function toast(s){clearTimeout(toastTimer);document.getElementById('overlay').innerHTML=`<div class="toast" role="status">${esc(s)}</div>`;toastTimer=setTimeout(closeOverlay,4000)}
function closeOverlay(){document.getElementById('overlay').innerHTML='';openedId=null}
function detail(id){let x=state.events.find(x=>Number(x._id)===id);if(!x)return;openedId=id;document.getElementById('overlay').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="通知详情"><div class="sheet" tabindex="-1"><h3>${esc(title(x))}</h3><div class="amount" style="font-size:42px">${x.state==='auto'?signed(Number(x.cents)):'待识别'}</div><div class="statline"><span>支付渠道</span><span>${esc(x.source)}</span></div><p>${esc(dateTime(x.posted))}</p><div class="statcard"><h3>记录摘要</h3><div class="raw">${esc(x.content)}</div></div>${Number(x.cents)<0&&x.state==='auto'?'<p>退款抵扣收到当日净额，不关联原消费。</p>':''}<button class="primary" id="closeDetail">返回</button>${x.state!=='ignored'?'<button class="primary secondary" id="ignoreRecord">排除此通知</button>':''}</div></div>`;document.getElementById('closeDetail').onclick=closeOverlay;let ignore=document.getElementById('ignoreRecord');if(ignore)ignore.onclick=()=>{if(native){Ledger.ignore(id);closeOverlay()}else toast('排除记录需在手机中操作。')};document.querySelector('.sheet').focus()}
window.refreshLedger=function(){try{let raw=native?Ledger.readState():JSON.stringify(state);if(raw===last&&today===key(new Date()))return;let next=JSON.parse(raw);if(next.error){toast(next.error);return}last=raw;state=next;state.events=state.events||[];events=state.events.filter(x=>x.state==='auto').sort((a,b)=>Number(b.posted)-Number(a.posted));today=key(new Date());render()}catch(e){toast('账本暂时无法读取，请重新打开应用。')}};
window.handleBack=function(){if(document.getElementById('overlay').innerHTML){closeOverlay();return true}if(page!=='calendar'){page='calendar';render();return true}return false};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});refreshLedger();setInterval(refreshLedger,5000);
</script></body></html>
